    post:
      description: "Explicitly creates independent owned artifacts. Originals, snapshots\
        \ and scheduled bindings are unchanged; tests are not executed. Requires current\
        \ Flow create and owning specification/macro create permissions and entitlements.\
        \ Keep the same key and identical body after an ambiguous response; GET status\
        \ never resumes writes. Partial copies remain tracked. Agent-delegated grants\
        \ are not supported."
      operationId: createFlowRecovery
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowRecoveryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRecoveryOperation"
          description: Confirmed completed operation; retries reuse its result identities.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRecoveryOperation"
          description: Accepted or unconfirmed operation. Read its status; resume
            only this same intent explicitly.
          headers:
            Location:
              explode: false
              schema:
                type: string
              style: simple
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Recover a saved run as a new Flow and new dependency copies
      tags:
      - Flows
      x-sdk-stability: preview
      x-idempotent: true
