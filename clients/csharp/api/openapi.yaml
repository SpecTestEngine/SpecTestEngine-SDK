openapi: 3.0.3
info:
  contact:
    email: support@ste.software
    name: SpecTestEngine Support
    url: https://ste.software
  description: |
    The versioned integration contract for creating, running, observing, and exporting
    SpecTestEngine test assets. The API is project-scoped: the bearer token selects the
    company and active project, and clients must not send internal owner identifiers.

    Every operation requires a short-lived OAuth 2.0 bearer access token. Interactive
    integrations use Authorization Code with PKCE; CI and server-to-server integrations use
    Client Credentials. A SpecTestEngine company administrator registers the integration and
    approves capabilities through the Integration Builder. The builder offers only capabilities
    included in the company's subscription and maps the selection to token scopes. A valid token
    cannot enable a capability outside the current subscription. Generate or browse an SDK without
    credentials, then provide a token only when calling the API. See the SDK authentication guide
    for the complete public procedure.

    This alpha contract covers stable request/response workflows plus the bounded asynchronous
    lifecycle for WebSocket/WSS, SSE, gRPC Streaming, and MQTT tests. Interactive browser recording,
    MCP tools, and AI conversations are documented separately. Browser visual comparison review is
    exposed as a bounded preview workflow; live WebRTC transport and worker coordination remain
    internal implementation details.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: SpecTestEngine Public API
  version: 1.0.0-alpha.6
externalDocs:
  description: SpecTestEngine product documentation
  url: https://ste.software/docs/sdk
servers:
- description: Production
  url: https://app.ste.software
- description: Local Docker gateway
  url: http://localhost
security:
- BearerAuth: []
tags:
- description: Persist and execute REST contracts.
  name: REST specifications
- description: Persist and execute SOAP contracts.
  name: SOAP specifications
- description: Persist and execute GraphQL contracts.
  name: GraphQL specifications
- description: "Persist, validate, execute, observe, and cancel bounded WebSocket/WSS,\
    \ SSE, gRPC Streaming, and MQTT contracts."
  name: Streaming specifications
- description: Build reusable request and assertion fragments.
  name: Fragments
- description: Compose and execute ordered API and browser scenarios.
  name: Flows
- description: "Collect completed specification, UI macro, and flow runs into a release\
    \ evidence set."
  name: Run batches
- description: Promote run-batch evidence into baselines and inspect definition or
    behavior drift.
  name: Snapshots
- description: "Manage request workspaces, chains, variables, and reusable attachments."
  name: Craftsman
- description: Configure probes and inspect execution evidence.
  name: Sentinel
- description: "Generate tests, flows, and portable ATF projects."
  name: Generation
- description: Review failed PDF or image attachment assertions without retaining
    source documents.
  name: Document visual diffs
- description: Inspect immutable Browser comparison evidence and apply explicit revision-safe
    review outcomes.
  name: Browser visual reviews
paths:
  /browser/visual/comparisons/{comparisonId}:
    get:
      description: "Returns one immutable comparison generation, its evidence lineage,\
        \ normalized exclusions, and currently available review actions."
      operationId: getBrowserVisualComparison
      parameters:
      - description: Identifier of an immutable Browser visual comparison generation.
        explode: false
        in: path
        name: comparisonId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserVisualComparison"
          description: Browser visual comparison scoped to the token company and active
            project.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Get a Browser visual comparison
      tags:
      - Browser visual reviews
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/comparisons/{comparisonId}/use-current-as-new-baseline:
    post:
      description: Creates and activates a new immutable baseline revision. Historical
        comparison and baseline evidence remains addressable by Snapshot Timeline.
      operationId: useCurrentBrowserVisualAsNewBaseline
      parameters:
      - description: Identifier of an immutable Browser visual comparison generation.
        explode: false
        in: path
        name: comparisonId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserVisualPromoteBaselineRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserVisualComparison"
          description: Reviewed comparison with the applied baseline revision.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The expected assertion revision is stale or the action id conflicts
            with another command.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Use current as new baseline
      tags:
      - Browser visual reviews
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/comparisons/{comparisonId}/exclude-and-recompare:
    post:
      description: Saves normalized exclusion masks in a new assertion revision and
        creates a child comparison generation with the existing Browser comparator.
      operationId: excludeBrowserVisualAreaAndRecompare
      parameters:
      - description: Identifier of an immutable Browser visual comparison generation.
        explode: false
        in: path
        name: comparisonId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserVisualExcludeAndRecompareRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserVisualComparison"
          description: New comparison generation linked to the source and root comparisons.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The expected assertion revision is stale or the action id conflicts
            with another command.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Exclude area and recompare
      tags:
      - Browser visual reviews
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/comparisons/{comparisonId}/keep-as-regression:
    post:
      description: Confirms the mismatch as a regression without changing the active
        baseline or assertion exclusions.
      operationId: keepBrowserVisualAsRegression
      parameters:
      - description: Identifier of an immutable Browser visual comparison generation.
        explode: false
        in: path
        name: comparisonId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserVisualKeepRegressionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserVisualComparison"
          description: Comparison marked as a confirmed regression.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Keep as regression
      tags:
      - Browser visual reviews
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/artifacts/{artifactId}/content:
    get:
      description: "Returns a retained PNG baseline, current, or diff artifact after\
        \ company and project authorization."
      operationId: getBrowserVisualArtifactContent
      parameters:
      - explode: false
        in: path
        name: artifactId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            image/png:
              schema:
                format: binary
                type: string
          description: PNG visual evidence subject to the configured artifact retention
            policy.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The artifact expired; comparison metadata and lineage remain
            available.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Download Browser visual evidence
      tags:
      - Browser visual reviews
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/document-diffs/{visualDiffId}:
    get:
      description: "Returns the protected viewer URL, TTL, immutable generations,\
        \ and page-level artifact references."
      operationId: getDocumentVisualDiff
      parameters:
      - description: UUIDv7 identifier of an organization-scoped visual document diff
          session.
        explode: false
        in: path
        name: visualDiffId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVisualDiff"
          description: Visual diff metadata scoped to the token company and active
            project.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Derived visual artifacts expired; source run metadata remains
            available.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Get a visual document diff
      tags:
      - Document visual diffs
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/document-diffs/{visualDiffId}/expected:
    post:
      description: The uploaded PDF or image is rendered in memory and discarded.
        Only encrypted page images and diff metadata remain until TTL expiry.
      operationId: uploadDocumentVisualDiffExpected
      parameters:
      - description: UUIDv7 identifier of an organization-scoped visual document diff
          session.
        explode: false
        in: path
        name: visualDiffId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      - explode: true
        in: query
        name: colorThreshold
        required: false
        schema:
          default: 24
          format: double
          maximum: 441.6729559300637
          minimum: 0
          type: number
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadDocumentVisualDiffExpected_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVisualDiff"
          description: The visual diff with a new current generation.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Upload a reference document and create a diff generation
      tags:
      - Document visual diffs
      x-sdk-stability: preview
      x-idempotent: false
  /browser/visual/document-diffs/{visualDiffId}/regenerate:
    post:
      description: Creates an immutable generation from the existing rendered pages
        with new comparison settings and normalized visual exclusion regions.
      operationId: regenerateDocumentVisualDiff
      parameters:
      - description: UUIDv7 identifier of an organization-scoped visual document diff
          session.
        explode: false
        in: path
        name: visualDiffId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVisualDiffRegenerateRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVisualDiff"
          description: Visual diff with a new current generation.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Regenerate a visual document diff
      tags:
      - Document visual diffs
      x-sdk-stability: preview
      x-idempotent: false
  /browser/visual/document-diffs/{visualDiffId}/baseline:
    post:
      description: "Never silently overwrites a specification. Send confirm=false\
        \ first, then confirm=true only after review."
      operationId: prepareDocumentVisualDiffBaseline
      parameters:
      - description: UUIDv7 identifier of an organization-scoped visual document diff
          session.
        explode: false
        in: path
        name: visualDiffId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVisualDiffBaselineRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVisualDiffBaselinePreview"
          description: Baseline hash/fingerprint preview or confirmed update draft.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Preview or create an attachment baseline update draft
      tags:
      - Document visual diffs
      x-sdk-stability: preview
      x-idempotent: true
  /browser/visual/document-diffs/{visualDiffId}/artifacts/{artifactId}:
    get:
      operationId: getDocumentVisualDiffArtifact
      parameters:
      - description: UUIDv7 identifier of an organization-scoped visual document diff
          session.
        explode: false
        in: path
        name: visualDiffId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      - explode: false
        in: path
        name: artifactId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            image/png:
              schema:
                format: binary
                type: string
          description: Decrypted PNG page. The encrypted derivative remains subject
            to the diagnostic TTL.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Download a rendered visual diff page
      tags:
      - Document visual diffs
      x-sdk-stability: preview
      x-idempotent: true
  /test/rest-spec/page:
    get:
      operationId: listRestSpecifications
      parameters:
      - description: Zero-based page index.
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Maximum number of results returned in one page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Case-insensitive server-side search within the active project.
        explode: true
        in: query
        name: search
        required: false
        schema:
          maxLength: 512
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationPage"
          description: A page of REST specifications.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: List REST specifications
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
  /test/rest-spec/create:
    post:
      operationId: createRestSpecification
      parameters:
      - description: User-facing specification name within the active project.
        explode: true
        in: query
        name: specName
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: form
      - description: Optional user-facing description stored with the asset.
        explode: true
        in: query
        name: description
        required: false
        schema:
          maxLength: 1000
          type: string
        style: form
      - description: A caller-generated UUID retained for safe write retries where
          supported.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        $ref: "#/components/requestBodies/RawSpecification"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
          description: The stored REST specification.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Create a REST specification
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: false
  /test/rest-spec/by-id:
    delete:
      operationId: deleteRestSpecification
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: true
        in: query
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
          description: The deleted REST specification.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Delete a REST specification
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
    get:
      operationId: getRestSpecification
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: true
        in: query
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
          description: The requested REST specification.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Get a REST specification
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
    put:
      operationId: updateRestSpecification
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: true
        in: query
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: form
      - description: Optional user-facing description stored with the asset.
        explode: true
        in: query
        name: description
        required: false
        schema:
          maxLength: 1000
          type: string
        style: form
      requestBody:
        $ref: "#/components/requestBodies/RawSpecification"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
          description: The updated REST specification.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Replace a REST specification definition
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
  /test/rest-spec/run/by-id:
    post:
      description: Starts and completes one synchronous specification execution.
      operationId: runRestSpecification
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: true
        in: query
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRun"
          description: Complete run evidence.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Run a saved REST specification
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: false
  /test/rest-spec/run/by-id/{specId}/visual-diff-captures:
    post:
      description: Explicitly reruns the saved REST specification and temporarily
        captures one failed PDF or image response. The attachment assertion and run
        keep their real failed status; no visual-diff fallback changes the test result.
      operationId: captureRestSpecificationAttachmentVisualDiff
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: false
        in: path
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVisualDiffCaptureRunRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRun"
          description: Complete failed run evidence containing the temporary visual
            diff link.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Create a visual diff from a failed REST attachment assertion
      tags:
      - REST specifications
      x-sdk-stability: preview
      x-idempotent: false
  /test/rest-spec/run/page/by-spec-id/{specId}:
    get:
      operationId: listRestSpecificationRuns
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: false
        in: path
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      - description: Zero-based page index.
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Maximum number of results returned in one page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRunPage"
          description: A page of run summaries.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: List saved REST runs
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
  /test/rest-spec/run/history/by-run-id/{runId}:
    get:
      operationId: getRestSpecificationRun
      parameters:
      - description: UUIDv7 identifier of the stored run evidence.
        explode: false
        in: path
        name: runId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRun"
          description: Complete saved run evidence.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Get saved REST run evidence
      tags:
      - REST specifications
      x-sdk-stability: stable
      x-idempotent: true
  /test/rest-spec/recovery/{specId}/from-run/{runId}/preview:
    post:
      description: Compares the current specification with the exact DSL snapshot
        retained by a completed PASS or FAIL run. No expectations are regenerated.
      operationId: previewRestSpecificationRecovery
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: false
        in: path
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      - description: UUIDv7 identifier of the stored run evidence.
        explode: false
        in: path
        name: runId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRecoveryPreview"
          description: Definition-only recovery preview.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Preview restoring a REST specification version
      tags:
      - REST specifications
      x-sdk-stability: preview
      x-idempotent: true
  /test/rest-spec/recovery/{specId}/from-run/{runId}/test-run:
    post:
      description: Executes the exact DSL snapshot retained by the selected completed
        PASS or FAIL run against the current API without changing the saved specification.
      operationId: testRestSpecificationRecoveryVersion
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: false
        in: path
        name: specId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      - description: UUIDv7 identifier of the stored run evidence.
        explode: false
        in: path
        name: runId
        required: true
        schema:
          $ref: "#/components/schemas/UuidV7"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationRun"
          description: Complete test-run evidence for the selected version.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request failed.
      summary: Test a previous REST specification version
      tags:
      - REST specifications
      x-sdk-stability: preview
      x-idempotent: false
  /test/rest-spec/recovery/{specId}/from-run/{runId}/restore:
    put:
      description: "Replaces only the current DSL content with the exact snapshot\
        \ retained by a completed PASS or FAIL run. The specification id, name, description,\
        \ and stable identity are preserved."
      operationId: restoreRestSpecificationFromRun
      parameters:
      - description: UUIDv7 identifier of the saved specification.
        explode: false
        in: path
        name: specId
