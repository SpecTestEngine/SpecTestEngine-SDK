  schemas:
    UuidV7:
      description: A UUIDv7 identifier. Treat identifiers as opaque values.
      example: 0197f0ab-42e7-7a31-8a9c-591a8ee54c12
      format: uuid
      type: string
    BrowserVisualScopeType:
      description: "PAGE compares the page canvas, ELEMENT the selected element canvas,\
        \ and REGION a page crop selected by normalized bounds."
      enum:
      - PAGE
      - ELEMENT
      - REGION
      type: string
    BrowserVisualCompareMode:
      description: Existing Browser comparator mode. Exclusions mask the comparison
        canvas before this comparator runs.
      enum:
      - STRICT
      - LAYOUT
      - TEXT_AND_LAYOUT
      - TEXT_ONLY
      type: string
    BrowserVisualStopPolicy:
      enum:
      - STOP_RUN
      - CONTINUE_AND_REVIEW
      type: string
    BrowserVisualComparisonStatus:
      enum:
      - PASSED
      - FAILED
      - BASELINE_MISSING
      - REVIEW_REQUIRED
      type: string
    BrowserVisualDecisionStatus:
      enum:
      - UNREVIEWED
      - EXPECTED_CHANGE
      - EXCLUDED_AND_RECOMPARED
      - CONFIRMED_REGRESSION
      - NEEDS_INVESTIGATION
      type: string
    BrowserVisualExcludedRegion:
      description: "Normalized rectangle relative to the active PAGE, ELEMENT, or\
        \ REGION comparison canvas. Exclusions apply before pixel, SSIM, changed-region\
        \ and scoped semantic comparison; URL, title, and network checks remain active.\
        \ Overlaps are valid. Right/bottom overflow is clipped without moving the\
        \ origin; a rectangle without in-canvas area is rejected."
      example:
        reason: reason
        widthRatio: 0.684685269835264
        xRatio: 0.10246457001441578
        yRatio: 0.14894159098541704
        heightRatio: 0.7457744773683765
      properties:
        xRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        yRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        widthRatio:
          exclusiveMinimum: true
          format: double
          maximum: 1
          minimum: 0
          type: number
        heightRatio:
          exclusiveMinimum: true
          format: double
          maximum: 1
          minimum: 0
          type: number
        reason:
          maxLength: 300
          nullable: true
          type: string
      required:
      - heightRatio
      - widthRatio
      - xRatio
      - yRatio
      type: object
    BrowserVisualBounds:
      description: "Normalized capture rectangle in page coordinates for REGION scope.\
        \ Excluded regions are relative to the resulting cropped canvas, not to these\
        \ page coordinates."
      properties:
        leftRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        topRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        widthRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        heightRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
      type: object
    BrowserVisualAssertionInput:
      description: "Saved visual assertion. The existing Java comparator and thresholds\
        \ are unchanged. Baseline images are raw captures, never WebRTC video frames.\
        \ Omitted exclusions mean an empty list."
      properties:
        enabled:
          type: boolean
        name:
          maxLength: 255
          type: string
        scopeType:
          $ref: "#/components/schemas/BrowserVisualScopeType"
        compareMode:
          $ref: "#/components/schemas/BrowserVisualCompareMode"
        stopPolicy:
          $ref: "#/components/schemas/BrowserVisualStopPolicy"
        maxDiffPixels:
          format: int64
          minimum: 0
          type: integer
        maxDiffPixelRatio:
          format: double
          type: number
        colorThreshold:
          format: double
          type: number
        moveTolerancePx:
          format: double
          type: number
        bounds:
          allOf:
          - $ref: "#/components/schemas/BrowserVisualBounds"
          nullable: true
        excludedRegions:
          items:
            $ref: "#/components/schemas/BrowserVisualExcludedRegion"
          maxItems: 250
          type: array
        baselineScreenshotBase64:
          description: Raw baseline capture supplied during authoring; omitted from
            saved definition reads.
          format: byte
          type: string
        baselineSemanticJson:
          maxLength: 12000
          type: string
      type: object
    BrowserVisualAssertion:
      description: Persisted visual definition. Revisions are server-owned; baseline
        bytes are fetched separately through retained artifact references.
      properties:
        enabled:
          type: boolean
        name:
          nullable: true
          type: string
        scopeType:
          $ref: "#/components/schemas/BrowserVisualScopeType"
        compareMode:
          $ref: "#/components/schemas/BrowserVisualCompareMode"
        stopPolicy:
          $ref: "#/components/schemas/BrowserVisualStopPolicy"
        baselineArtifactId:
          format: uuid
          nullable: true
          type: string
        baselineRevisionId:
          format: uuid
          nullable: true
          type: string
        assertionRevision:
          format: int64
          minimum: 0
          type: integer
        maxDiffPixels:
          format: int64
          nullable: true
          type: integer
        maxDiffPixelRatio:
          format: double
          nullable: true
          type: number
        colorThreshold:
          format: double
          nullable: true
          type: number
        moveTolerancePx:
          format: double
          nullable: true
          type: number
        bounds:
          allOf:
          - $ref: "#/components/schemas/BrowserVisualBounds"
          nullable: true
        excludedRegions:
          items:
            $ref: "#/components/schemas/BrowserVisualExcludedRegion"
          maxItems: 250
          type: array
      required:
      - assertionRevision
      - enabled
      - excludedRegions
      type: object
    BrowserVisualComparisonSummary:
      description: Immutable visual evidence embedded in a Flow run or Snapshot behavior
        payload. Empty diagnostic/exclusion lists may be omitted. Fetch the comparison
        detail lazily for review capabilities.
      properties:
        comparisonId:
          format: uuid
          nullable: true
          type: string
        status:
          $ref: "#/components/schemas/BrowserVisualComparisonStatus"
        decisionStatus:
          $ref: "#/components/schemas/BrowserVisualDecisionStatus"
        scopeType:
          $ref: "#/components/schemas/BrowserVisualScopeType"
        compareMode:
          $ref: "#/components/schemas/BrowserVisualCompareMode"
        stopPolicy:
          $ref: "#/components/schemas/BrowserVisualStopPolicy"
        baselineArtifactId:
          format: uuid
          nullable: true
          type: string
        actualArtifactId:
          format: uuid
          nullable: true
          type: string
        diffArtifactId:
          format: uuid
          nullable: true
          type: string
        diffPixels:
          format: int64
          nullable: true
          type: integer
        diffPixelRatio:
          format: double
          nullable: true
          type: number
        message:
          nullable: true
          type: string
        changedDetails:
          items:
            type: string
          type: array
        changedRegions:
          items:
            $ref: "#/components/schemas/BrowserVisualDiffRegion"
          type: array
        assertionRevision:
          format: int64
          type: integer
        baselineRevisionId:
          format: uuid
          nullable: true
          type: string
        generationNumber:
          type: integer
        sourceComparisonId:
          format: uuid
          nullable: true
          type: string
        rootComparisonId:
          format: uuid
          nullable: true
          type: string
        excludedRegions:
          items:
            $ref: "#/components/schemas/BrowserVisualExcludedRegion"
          maxItems: 250
          type: array
        changedExcludedRegionIndexes:
          items:
            minimum: 0
            type: integer
          type: array
      type: object
    BrowserVisualDiffRegion:
      example:
        leftRatio: 0.9301444243932576
        widthRatio: 0.20271230230023218
        x: 0
        width: 1
        "y": 0
        diffPixels: 0
        topRatio: 0.3616076749251911
        heightRatio: 0.4145608029883936
        height: 1
      properties:
        x:
          minimum: 0
          type: integer
        "y":
          minimum: 0
          type: integer
        width:
          minimum: 1
          type: integer
        height:
          minimum: 1
          type: integer
        diffPixels:
          format: int64
          minimum: 0
          type: integer
        leftRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        topRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        widthRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
        heightRatio:
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
      - diffPixels
      - height
      - heightRatio
      - leftRatio
      - topRatio
      - width
      - widthRatio
      - x
      - "y"
      type: object
    BrowserVisualReviewCapability:
      example:
        disabledReason: disabledReason
        available: true
        state: AVAILABLE
      properties:
        available:
          type: boolean
        state:
          enum:
          - AVAILABLE
          - ALREADY_APPLIED
          - NO_PERMISSION
          - STALE_ASSERTION
          - EVIDENCE_EXPIRED
          - UNSUPPORTED_SEMANTIC_SNAPSHOT
          - BACKEND_FAILURE
          - NOT_APPLICABLE
          type: string
        disabledReason:
          nullable: true
          type: string
      required:
      - available
      - state
      type: object
    BrowserVisualReviewCapabilities:
      example:
        useCurrentAsNewBaseline:
          disabledReason: disabledReason
          available: true
          state: AVAILABLE
        keepAsRegression:
          disabledReason: disabledReason
          available: true
          state: AVAILABLE
        excludeAreaAndRecompare:
          disabledReason: disabledReason
