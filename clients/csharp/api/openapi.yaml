        excludeAreaAndRecompare:
          $ref: "#/components/schemas/BrowserVisualReviewCapability"
        keepAsRegression:
          $ref: "#/components/schemas/BrowserVisualReviewCapability"
      required:
      - excludeAreaAndRecompare
      - keepAsRegression
      - useCurrentAsNewBaseline
