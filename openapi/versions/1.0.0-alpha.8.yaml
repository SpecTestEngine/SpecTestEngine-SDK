      properties:
        specType:
          type: string
          enum: [REST, SOAP, GRAPHQL, STREAMING]
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
          maxLength: 8192
        streamingSpec:
          allOf:
            - $ref: '#/components/schemas/StreamingDefinition'
          nullable: true
        headers:
          type: object
          maxProperties: 128
          additionalProperties:
            type: string
            maxLength: 10000
        queryParams:
          type: object
          maxProperties: 256
          additionalProperties:
            type: string
            maxLength: 10000
        body:
          type: string
          nullable: true
          maxLength: 10485760
        auth:
          type: object
          nullable: true
          additionalProperties: true
        requestAuth:
          type: object
          nullable: true
          additionalProperties: true
        requestAttachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DocumentAssetReference'
        prerequisites:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
    DocumentAssetReference:
      type: object
      required: [assetId, fileName, contentType, sizeBytes, sha256, objectKey, fieldName]
      properties:
        assetId:
          $ref: '#/components/schemas/UuidV7'
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 26214400
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        objectKey:
          type: string
          maxLength: 1024
        fieldName:
          type: string
          maxLength: 255
        contentId:
          type: string
          nullable: true
          maxLength: 255
    RequestChainRunInput:
      type: object
      properties:
        overrideValues:
          type: object
          additionalProperties: true
        globalVariables:
          type: object
          additionalProperties:
            type: string
        globalVariableFallbacks:
          type: object
          additionalProperties:
            type: string
        draftRequest:
          $ref: '#/components/schemas/SavedRequestInput'
    RequestChainRun:
      type: object
      required: [workspaceId, requestNodeId, flowName, overallTestFlowStatus, steps, context, startedAt, finishedAt]
      properties:
        workspaceId:
          $ref: '#/components/schemas/UuidV7'
        requestNodeId:
          $ref: '#/components/schemas/UuidV7'
        flowName:
          type: string
        description:
          type: string
          nullable: true
        overallTestFlowStatus:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        context:
          type: object
          description: Values explicitly captured during this run. Workflow/global input values and secret sources are not echoed here.
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    CraftsmanRunState:
      type: string
