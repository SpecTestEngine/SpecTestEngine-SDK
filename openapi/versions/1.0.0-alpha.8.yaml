  /spec/generate:
    post:
      tags: [Generation]
      summary: Generate an executable specification from concrete request evidence
      description: |
        Generates a REST, SOAP, GraphQL, or Streaming specification. Streaming input may
        contain observedEvidence from a completed Craftsman session; generation derives
        expectations from that transcript and never opens a second connection. Workflow
        placeholders must be materialized before this endpoint is called.
      operationId: generateSpecification
      x-sdk-stability: beta
      x-idempotent: true
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [FULL, PATHS, HYBRID]
            default: FULL
        - name: format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentFormat'
        - name: specGenerationTypes
          in: query
          required: false
          description: Comma-separated generation variants. Streaming currently accepts POSITIVE only.
          schema:
            type: array
            default: [POSITIVE]
            items:
              type: string
              enum: [POSITIVE, NEGATIVE, DUPLICATE]
          style: form
          explode: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Concrete protocol request data; Streaming generation additionally accepts observedEvidence.
              additionalProperties: true
      responses:
        '200':
          description: Generated executable specification variants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecGenerationResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
