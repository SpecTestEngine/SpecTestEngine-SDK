  /test/flow/run/saved/{runId}/recovery:
    post:
      tags: [Flows]
      summary: Recover a saved run as a new Flow and new dependency copies
      description: Explicitly creates independent owned artifacts. Originals, snapshots and scheduled bindings are unchanged; tests are not executed. Requires current Flow create and owning specification/macro create permissions and entitlements. Keep the same key and identical body after an ambiguous response; GET status never resumes writes. Partial copies remain tracked. Agent-delegated grants are not supported.
      operationId: createFlowRecovery
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowRecoveryInput' }
      responses:
        '200':
          description: Confirmed completed operation; retries reuse its result identities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowRecoveryOperation' }
        '202':
          description: Accepted or unconfirmed operation. Read its status; resume only this same intent explicitly.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowRecoveryOperation' }
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        default: { $ref: '#/components/responses/ErrorResponse' }
