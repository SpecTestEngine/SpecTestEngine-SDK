      type: object
      required: [historical, targetRevision, dependencyRevisions, occurrences, restoreAvailable]
      properties:
        historical: { $ref: '#/components/schemas/FlowRecoveryPreview' }
        targetRevision: { type: integer, format: int64, minimum: 0 }
        targetName: { type: string, nullable: true }
        targetDescription: { type: string, nullable: true }
        dependencyRevisions:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        occurrences: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FlowRecoveryOccurrence' } }
        restoreAvailable: { type: boolean }
        restoreReason: { type: string, nullable: true }
