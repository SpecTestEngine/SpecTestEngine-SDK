            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactGenerationProfile'
        '409':
          description: The profile was updated after the supplied revision was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Generation]
      summary: Delete a CI export profile
      operationId: deleteArtifactGenerationProfile
      x-sdk-stability: beta
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '204':
          description: The profile was deleted.
        default:
          $ref: '#/components/responses/ErrorResponse'
  /artifact-profiles/{profileId}/environments/{environmentKey}/bundle/refresh:
    post:
      tags: [Generation]
      summary: Capture or refresh an environment baseline
      description: Resolves current selected assets and atomically stores the bundle plus its hash for PINNED or FAIL_ON_DRIFT downloads.
      operationId: refreshArtifactGenerationProfileBundle
      x-sdk-stability: beta
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ProfileIdPath'
        - $ref: '#/components/parameters/EnvironmentKeyPath'
      responses:
        '200':
          description: The refreshed profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactGenerationProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /artifact-profiles/{profileId}/environments/{environmentKey}/atf/archive:
    post:
      tags: [Generation]
      summary: Validate and download a CI profile archive
      description: Resolves the environment policy, enforces drift rules, then returns an archive only after the generated project passes compile validation.
      operationId: downloadArtifactGenerationProfileArchive
      x-sdk-stability: beta
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ProfileIdPath'
        - $ref: '#/components/parameters/EnvironmentKeyPath'
      responses:
        '200':
          description: A compile-validated ATF project archive.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '422':
          description: The generated project did not pass readiness validation; no archive was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: The bounded validation capacity is currently in use. Retry after another validation completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived OAuth 2.0 access token issued for the SpecTestEngine API audience.
        Interactive integrations obtain it with Authorization Code and PKCE. CI and
        server-to-server integrations use Client Credentials. Register the integration through a
        SpecTestEngine company administrator and select only subscription-backed capabilities in
        the Integration Builder. Pass the resulting scoped token as
        `Authorization: Bearer <access-token>`. A valid token does not bypass subscription
        entitlements. Never place client secrets or access tokens in source code, URLs, logs, or
        generated SDK artifacts.
      x-documentation-url: https://ste.software/docs/sdk?view=authentication

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Maximum number of results returned in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive server-side search within the active project.
      schema:
        type: string
        maxLength: 512
    Environment:
      name: environment
      in: query
      required: true
      description: Environment scope used to isolate Sentinel checks, runs, dashboard metrics, and incidents.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$'
    Description:
      name: description
      in: query
      required: false
      description: Optional user-facing description stored with the asset.
      schema:
        type: string
        maxLength: 1000
    SpecName:
      name: specName
      in: query
      required: true
      description: User-facing specification name within the active project.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SpecId:
      name: specId
      in: query
      required: true
      description: UUIDv7 identifier of the saved specification.
      schema:
        $ref: '#/components/schemas/UuidV7'
    SpecIdPath:
      name: specId
      in: path
      required: true
      description: UUIDv7 identifier of the saved specification.
      schema:
        $ref: '#/components/schemas/UuidV7'
    FlowIdPath:
      name: flowId
      in: path
      required: true
      description: UUIDv7 identifier of the saved test flow.
      schema:
        $ref: '#/components/schemas/UuidV7'
    VisualDiffId:
      name: visualDiffId
      in: path
      required: true
      description: UUIDv7 identifier of an organization-scoped visual document diff session.
      schema:
        $ref: '#/components/schemas/UuidV7'
    BrowserVisualComparisonId:
      name: comparisonId
      in: path
      required: true
      description: Identifier of an immutable Browser visual comparison generation.
      schema:
        type: string
        format: uuid
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: UUIDv7 identifier of the saved run batch.
      schema:
        $ref: '#/components/schemas/UuidV7'
    SnapshotIdPath:
      name: snapshotId
      in: path
      required: true
      description: UUIDv7 identifier of the saved snapshot baseline.
      schema:
        $ref: '#/components/schemas/UuidV7'
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      description: UUIDv7 identifier of the Craftsman request workspace.
      schema:
        $ref: '#/components/schemas/UuidV7'
    CheckIdPath:
      name: checkId
      in: path
      required: true
      description: UUIDv7 identifier of the Sentinel check.
      schema:
        $ref: '#/components/schemas/UuidV7'
    RunIdPath:
      name: runId
      in: path
      required: true
      description: UUIDv7 identifier of the stored run evidence.
      schema:
        $ref: '#/components/schemas/UuidV7'
    ProfileIdPath:
      name: profileId
      in: path
      required: true
      description: UUIDv7 identifier of a CI export profile.
      schema:
        $ref: '#/components/schemas/UuidV7'
    EnvironmentKeyPath:
      name: environmentKey
      in: path
      required: true
      description: Stable profile environment key such as test, staging, or production.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
    ValidationIdPath:
      name: validationId
      in: path
      required: true
      description: Opaque identifier of a bounded asynchronous ATF validation job.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Format:
      name: format
      in: query
      required: false
      description: Serialization format used for the returned specification source.
      schema:
        $ref: '#/components/schemas/ContentFormat'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A caller-generated UUID retained for safe write retries where supported.
      schema:
        type: string
        format: uuid

  requestBodies:
    RawSpecification:
      required: true
      content:
        application/json:
          schema:
            type: string
            minLength: 2
            maxLength: 10485760
            description: A complete JSON DSL document encoded as the request body.

  responses:
    ErrorResponse:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    UuidV7:
      type: string
      format: uuid
      description: A UUIDv7 identifier. Treat identifiers as opaque values.
      example: 0197f0ab-42e7-7a31-8a9c-591a8ee54c12
    BrowserVisualScopeType:
      type: string
      enum: [PAGE, ELEMENT, REGION]
      description: PAGE compares the page canvas, ELEMENT the selected element canvas, and REGION a page crop selected by normalized bounds.
    BrowserVisualCompareMode:
      type: string
      enum: [STRICT, LAYOUT, TEXT_AND_LAYOUT, TEXT_ONLY]
      description: Existing Browser comparator mode. Exclusions mask the comparison canvas before this comparator runs.
    BrowserVisualStopPolicy:
      type: string
      enum: [STOP_RUN, CONTINUE_AND_REVIEW]
    BrowserVisualComparisonStatus:
      type: string
      enum: [PASSED, FAILED, BASELINE_MISSING, REVIEW_REQUIRED]
    BrowserVisualDecisionStatus:
      type: string
      enum: [UNREVIEWED, EXPECTED_CHANGE, EXCLUDED_AND_RECOMPARED, CONFIRMED_REGRESSION, NEEDS_INVESTIGATION]
    BrowserVisualExcludedRegion:
      type: object
      description: Normalized rectangle relative to the active PAGE, ELEMENT, or REGION comparison canvas. Exclusions apply before pixel, SSIM, changed-region and scoped semantic comparison; URL, title, and network checks remain active. Overlaps are valid. Right/bottom overflow is clipped without moving the origin; a rectangle without in-canvas area is rejected.
      required: [xRatio, yRatio, widthRatio, heightRatio]
      properties:
        xRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        yRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        widthRatio: { type: number, format: double, minimum: 0, exclusiveMinimum: true, maximum: 1 }
        heightRatio: { type: number, format: double, minimum: 0, exclusiveMinimum: true, maximum: 1 }
        reason: { type: string, nullable: true, maxLength: 300 }
    BrowserVisualBounds:
      type: object
      description: Normalized capture rectangle in page coordinates for REGION scope. Excluded regions are relative to the resulting cropped canvas, not to these page coordinates.
      properties:
        leftRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        topRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        widthRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        heightRatio: { type: number, format: double, minimum: 0, maximum: 1 }
    BrowserVisualAssertionInput:
      type: object
      description: Saved visual assertion. The existing Java comparator and thresholds are unchanged. Baseline images are raw captures, never WebRTC video frames. Omitted exclusions mean an empty list.
      properties:
        enabled: { type: boolean }
        name: { type: string, maxLength: 255 }
        scopeType: { $ref: '#/components/schemas/BrowserVisualScopeType' }
        compareMode: { $ref: '#/components/schemas/BrowserVisualCompareMode' }
        stopPolicy: { $ref: '#/components/schemas/BrowserVisualStopPolicy' }
        maxDiffPixels: { type: integer, format: int64, minimum: 0 }
        maxDiffPixelRatio: { type: number, format: double }
        colorThreshold: { type: number, format: double }
        moveTolerancePx: { type: number, format: double }
        bounds:
          allOf: [{ $ref: '#/components/schemas/BrowserVisualBounds' }]
          nullable: true
        excludedRegions:
          type: array
          maxItems: 250
          items: { $ref: '#/components/schemas/BrowserVisualExcludedRegion' }
        baselineScreenshotBase64:
          type: string
          format: byte
          description: Raw baseline capture supplied during authoring; omitted from saved definition reads.
        baselineSemanticJson: { type: string, maxLength: 12000 }
    BrowserVisualAssertion:
      type: object
      description: Persisted visual definition. Revisions are server-owned; baseline bytes are fetched separately through retained artifact references.
      required: [enabled, assertionRevision, excludedRegions]
      properties:
        enabled: { type: boolean }
        name: { type: string, nullable: true }
        scopeType: { $ref: '#/components/schemas/BrowserVisualScopeType' }
        compareMode: { $ref: '#/components/schemas/BrowserVisualCompareMode' }
        stopPolicy: { $ref: '#/components/schemas/BrowserVisualStopPolicy' }
        baselineArtifactId: { type: string, format: uuid, nullable: true }
        baselineRevisionId: { type: string, format: uuid, nullable: true }
        assertionRevision: { type: integer, format: int64, minimum: 0 }
        maxDiffPixels: { type: integer, format: int64, nullable: true }
        maxDiffPixelRatio: { type: number, format: double, nullable: true }
        colorThreshold: { type: number, format: double, nullable: true }
        moveTolerancePx: { type: number, format: double, nullable: true }
        bounds:
          allOf: [{ $ref: '#/components/schemas/BrowserVisualBounds' }]
          nullable: true
        excludedRegions:
          type: array
          maxItems: 250
          items: { $ref: '#/components/schemas/BrowserVisualExcludedRegion' }
    BrowserVisualComparisonSummary:
      type: object
      description: Immutable visual evidence embedded in a Flow run or Snapshot behavior payload. Empty diagnostic/exclusion lists may be omitted. Fetch the comparison detail lazily for review capabilities.
      properties:
        comparisonId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/BrowserVisualComparisonStatus' }
        decisionStatus: { $ref: '#/components/schemas/BrowserVisualDecisionStatus' }
        scopeType: { $ref: '#/components/schemas/BrowserVisualScopeType' }
        compareMode: { $ref: '#/components/schemas/BrowserVisualCompareMode' }
        stopPolicy: { $ref: '#/components/schemas/BrowserVisualStopPolicy' }
        baselineArtifactId: { type: string, format: uuid, nullable: true }
        actualArtifactId: { type: string, format: uuid, nullable: true }
        diffArtifactId: { type: string, format: uuid, nullable: true }
        diffPixels: { type: integer, format: int64, nullable: true }
        diffPixelRatio: { type: number, format: double, nullable: true }
        message: { type: string, nullable: true }
        changedDetails: { type: array, items: { type: string } }
        changedRegions:
          type: array
          items: { $ref: '#/components/schemas/BrowserVisualDiffRegion' }
        assertionRevision: { type: integer, format: int64 }
        baselineRevisionId: { type: string, format: uuid, nullable: true }
        generationNumber: { type: integer }
        sourceComparisonId: { type: string, format: uuid, nullable: true }
        rootComparisonId: { type: string, format: uuid, nullable: true }
        excludedRegions:
          type: array
          maxItems: 250
          items: { $ref: '#/components/schemas/BrowserVisualExcludedRegion' }
        changedExcludedRegionIndexes:
          type: array
          items: { type: integer, minimum: 0 }
    BrowserVisualDiffRegion:
      type: object
      required: [x, y, width, height, diffPixels, leftRatio, topRatio, widthRatio, heightRatio]
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        diffPixels: { type: integer, format: int64, minimum: 0 }
        leftRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        topRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        widthRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        heightRatio: { type: number, format: double, minimum: 0, maximum: 1 }
    BrowserVisualReviewCapability:
      type: object
      required: [available, state]
      properties:
        available: { type: boolean }
        state:
          type: string
          enum: [AVAILABLE, ALREADY_APPLIED, NO_PERMISSION, STALE_ASSERTION, EVIDENCE_EXPIRED, UNSUPPORTED_SEMANTIC_SNAPSHOT, BACKEND_FAILURE, NOT_APPLICABLE]
        disabledReason: { type: string, nullable: true }
    BrowserVisualReviewCapabilities:
      type: object
      required: [useCurrentAsNewBaseline, excludeAreaAndRecompare, keepAsRegression]
      properties:
        useCurrentAsNewBaseline: { $ref: '#/components/schemas/BrowserVisualReviewCapability' }
        excludeAreaAndRecompare: { $ref: '#/components/schemas/BrowserVisualReviewCapability' }
        keepAsRegression: { $ref: '#/components/schemas/BrowserVisualReviewCapability' }
    BrowserVisualPromoteBaselineRequest:
      type: object
      required: [actionId, expectedAssertionRevision]
      properties:
        actionId:
          type: string
          format: uuid
          description: Client-generated idempotency key for this review command.
        expectedAssertionRevision:
          type: integer
          format: int64
          minimum: 1
          description: Current assertion revision. A stale value is rejected with HTTP 409.
    BrowserVisualExcludeAndRecompareRequest:
      type: object
      required: [actionId, expectedAssertionRevision, excludedRegions]
      properties:
        actionId:
          type: string
          format: uuid
          description: Client-generated idempotency key for this review command.
        expectedAssertionRevision:
          type: integer
          format: int64
          minimum: 1
          description: Current assertion revision. A stale value is rejected with HTTP 409.
        excludedRegions:
          type: array
          maxItems: 250
          description: Complete normalized exclusion set for the next assertion revision. Overlaps are valid; rectangles crossing right or bottom edges are clamped to the comparison canvas.
          items: { $ref: '#/components/schemas/BrowserVisualExcludedRegion' }
    BrowserVisualKeepRegressionRequest:
      type: object
      required: [actionId, expectedAssertionRevision]
      properties:
        actionId:
          type: string
          format: uuid
          description: Client-generated idempotency key for this review command.
        expectedAssertionRevision:
          type: integer
          format: int64
          minimum: 1
          description: Current assertion revision. A stale value is rejected with HTTP 409.
    BrowserVisualComparison:
      type: object
      description: Immutable visual comparison generation. Baseline promotion creates a new baseline revision; it never deletes evidence referenced by older comparisons or snapshots.
      required: [comparisonId, status, decisionStatus, scopeType, compareMode, stopPolicy, assertionRevision, generationNumber, rootComparisonId, excludedRegions, changedExcludedRegionIndexes, reviewCapabilities, createdAt]
      properties:
        comparisonId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BrowserVisualComparisonStatus' }
        decisionStatus: { $ref: '#/components/schemas/BrowserVisualDecisionStatus' }
        scopeType: { $ref: '#/components/schemas/BrowserVisualScopeType' }
        compareMode: { $ref: '#/components/schemas/BrowserVisualCompareMode' }
        stopPolicy: { $ref: '#/components/schemas/BrowserVisualStopPolicy' }
        baselineArtifactId: { type: string, format: uuid, nullable: true }
        actualArtifactId: { type: string, format: uuid, nullable: true }
        diffArtifactId: { type: string, format: uuid, nullable: true }
        diffPixels: { type: integer, format: int64, minimum: 0, nullable: true }
        diffPixelRatio: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }
        message: { type: string, nullable: true }
        changedDetails:
          type: array
          items: { type: string }
        changedRegions:
          type: array
          items: { $ref: '#/components/schemas/BrowserVisualDiffRegion' }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        assertionRevision: { type: integer, format: int64, minimum: 1 }
        baselineRevisionId: { type: string, format: uuid, nullable: true }
        appliedBaselineRevisionId: { type: string, format: uuid, nullable: true }
        generationNumber: { type: integer, minimum: 1 }
        sourceComparisonId: { type: string, format: uuid, nullable: true }
        rootComparisonId: { type: string, format: uuid }
        excludedRegions:
          type: array
          maxItems: 250
          items: { $ref: '#/components/schemas/BrowserVisualExcludedRegion' }
        changedExcludedRegionIndexes:
          type: array
          maxItems: 250
          uniqueItems: true
          items: { type: integer, minimum: 0 }
        reviewCapabilities: { $ref: '#/components/schemas/BrowserVisualReviewCapabilities' }
    DocumentVisualDiffStatus:
      type: string
      enum: [WAITING_FOR_EXPECTED, READY, FAILED, EXPIRED]
    DocumentVisualDiffCaptureRunRequest:
      type: object
      required: [attachmentId]
      properties:
        attachmentId:
          type: string
          minLength: 1
          maxLength: 255
          description: Attachment assertion identifier from the failed saved run, for example response.body.
    FlowDocumentVisualDiffCaptureRunRequest:
      type: object
      required: [stepOrderIndex, attachmentId]
      properties:
        stepOrderIndex:
          type: integer
          minimum: 0
          description: Zero-based order index of the saved API specification step.
        attachmentId:
          type: string
          minLength: 1
          maxLength: 255
          description: Attachment assertion identifier from that failed step.
    DocumentVisualDiffDecision:
      type: string
      enum: [UNREVIEWED, BASELINE_UPDATE_DRAFTED, CONFIRMED_REGRESSION, NEEDS_INVESTIGATION]
    DocumentVisualDiffPage:
      type: object
      required: [pageNumber, width, height]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        actualArtifactId: { $ref: '#/components/schemas/UuidV7', nullable: true }
        expectedArtifactId: { $ref: '#/components/schemas/UuidV7', nullable: true }
        diffArtifactId: { $ref: '#/components/schemas/UuidV7', nullable: true }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    DocumentVisualDiffGeneration:
      type: object
      required: [generationId, generationNumber, expectedSha256, colorThreshold, totalPages, changedPages, diffPixels, diffPixelRatio, createdAt, expiresAt, excludedRegions, changedExcludedRegionIndexes, pages]
      properties:
        generationId: { $ref: '#/components/schemas/UuidV7' }
        generationNumber: { type: integer, minimum: 1 }
        expectedSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        colorThreshold: { type: number, format: double }
        totalPages: { type: integer, minimum: 1 }
        changedPages: { type: integer, minimum: 0 }
        diffPixels: { type: integer, format: int64, minimum: 0 }
        diffPixelRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        excludedRegions:
          type: array
          description: Immutable normalized masks used by this generation.
          maxItems: 250
          items: { $ref: '#/components/schemas/DocumentVisualExcludedRegion' }
        changedExcludedRegionIndexes:
          type: array
          description: Indexes into excludedRegions whose masked area contained a real change in this immutable generation.
          maxItems: 250
          uniqueItems: true
          items: { type: integer, minimum: 0 }
        pages:
          type: array
          items: { $ref: '#/components/schemas/DocumentVisualDiffPage' }
    DocumentVisualDiff:
      type: object
      required: [visualDiffId, viewerUrl, sourceType, attachmentId, actualContentType, actualSha256, status, decision, actualPageCount, createdAt, expiresAt, actualAvailable, expectedUploadRequired, regenerateAvailable, generations]
      properties:
        visualDiffId: { $ref: '#/components/schemas/UuidV7' }
        viewerUrl: { type: string, format: uri }
        sourceType: { type: string, enum: [REST_SPEC_RUN, SOAP_SPEC_RUN, GRAPHQL_SPEC_RUN, FLOW_RUN, SPECIFICATION_RUN] }
        sourceRunId: { type: string, nullable: true }
        sourceStepId: { type: string, nullable: true }
        attachmentId: { type: string }
        actualContentType: { type: string }
        actualSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        expectedSha256: { type: string, nullable: true, pattern: '^[a-fA-F0-9]{64}$' }
        status: { $ref: '#/components/schemas/DocumentVisualDiffStatus' }
        decision: { $ref: '#/components/schemas/DocumentVisualDiffDecision' }
        actualPageCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        actualAvailable: { type: boolean }
        expectedUploadRequired: { type: boolean }
        regenerateAvailable: { type: boolean }
        generations:
          type: array
          items: { $ref: '#/components/schemas/DocumentVisualDiffGeneration' }
        currentGeneration:
          allOf: [{ $ref: '#/components/schemas/DocumentVisualDiffGeneration' }]
          nullable: true
    DocumentVisualDiffRegenerateRequest:
      type: object
      properties:
        colorThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 441.6729559300637
          default: 24
        excludedRegions:
          type: array
          maxItems: 250
          items: { $ref: '#/components/schemas/DocumentVisualExcludedRegion' }
    DocumentVisualExcludedRegion:
      type: object
      required: [pageNumber, xRatio, yRatio, widthRatio, heightRatio]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        xRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        yRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        widthRatio: { type: number, format: double, exclusiveMinimum: 0, maximum: 1 }
        heightRatio: { type: number, format: double, exclusiveMinimum: 0, maximum: 1 }
        reason: { type: string, nullable: true, maxLength: 500 }
    DocumentVisualAssertionPage:
      type: object
      required: [pageNumber, width, height, maskedSha256]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        maskedSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    DocumentVisualAssertion:
      type: object
      description: Persistent masked-render assertion. Protocol engines contact Browser Engine only when excludedRegions is non-empty and the local attachment hash or fingerprint failed.
      required: [version, algorithm, renderProfile, pages, excludedRegions]
      properties:
        version: { type: integer, enum: [1] }
        algorithm: { type: string, enum: [MASKED_RENDER_SHA256_V1] }
        renderProfile: { type: string }
        pages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DocumentVisualAssertionPage' }
        excludedRegions:
          type: array
          minItems: 1
          maxItems: 250
          items: { $ref: '#/components/schemas/DocumentVisualExcludedRegion' }
    DocumentAttachmentAssertionBaseline:
      type: object
      required: [id, expectedAttachmentHash]
      properties:
        id: { type: string }
