                $ref: '#/components/schemas/SpecificationRun'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/recovery/{specId}/from-run/{runId}/preview:
    post:
      tags: [REST specifications]
      summary: Preview restoring a REST specification version
      description: Compares the current specification with the exact DSL snapshot retained by a completed PASS or FAIL run. No expectations are regenerated.
      operationId: previewRestSpecificationRecovery
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Definition-only recovery preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecificationRecoveryPreview' }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/recovery/{specId}/from-run/{runId}/test-run:
    post:
      tags: [REST specifications]
      summary: Test a previous REST specification version
      description: Executes the exact DSL snapshot retained by the selected completed PASS or FAIL run against the current API without changing the saved specification.
      operationId: testRestSpecificationRecoveryVersion
      x-sdk-stability: preview
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Complete test-run evidence for the selected version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecificationRun' }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/recovery/{specId}/from-run/{runId}/restore:
    put:
      tags: [REST specifications]
      summary: Restore a REST specification version
      description: Replaces only the current DSL content with the exact snapshot retained by a completed PASS or FAIL run. The specification id, name, description, and stable identity are preserved.
      operationId: restoreRestSpecificationFromRun
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Restored specification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specification' }
        default:
          $ref: '#/components/responses/ErrorResponse'

