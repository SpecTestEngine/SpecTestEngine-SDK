    put:
      tags: [REST specifications]
      summary: Replace a REST specification definition
      operationId: updateRestSpecification
      x-sdk-stability: stable
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/Description'
      requestBody:
        $ref: '#/components/requestBodies/RawSpecification'
      responses:
        '200':
          description: The updated REST specification.
          content:
