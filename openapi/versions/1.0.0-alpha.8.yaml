    FlowRecoveryDraftInput:
      type: object
      required: [manifestHash, mode, draft, expectedFlowRevision, sourceStepIds, dependencyRevisions, bindings]
      properties:
        manifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        mode: { type: string, enum: [RESTORE, COPY] }
        draft:
          type: object
          description: Ordinary Flow create/update authoring shape, up to 16 MiB. Preserve retained visual references for owner validation.
          additionalProperties: true
        expectedFlowRevision: { type: integer, format: int64, minimum: 0 }
        sourceStepIds:
          type: array
          maxItems: 1000
          description: One original occurrence UUID per ordered draft step, or null for an added step. Identity does not grant authority.
          items: { type: string, format: uuid, nullable: true }
        dependencyRevisions:
          type: object
          maxProperties: 1000
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        bindings:
          type: object
          maxProperties: 1000
          description: Exactly required selected bindings. Preserve scalar types; never invent old literal inputs. Not retained in the journal.
          additionalProperties: true
