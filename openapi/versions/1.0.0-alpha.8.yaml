  /test/rest-spec/run/by-id:
    post:
      tags: [REST specifications]
      summary: Run a saved REST specification
      description: Starts and completes one synchronous specification execution.
      operationId: runRestSpecification
      x-sdk-stability: stable
      x-idempotent: false
      parameters:
