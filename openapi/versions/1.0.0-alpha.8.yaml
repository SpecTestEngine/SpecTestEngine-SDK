          type: integer
          nullable: true
        latencyMs:
          type: integer
          format: int64
          nullable: true
        responseSizeBytes:
          type: integer
          format: int64
          nullable: true
        errorMessage:
          type: string
          nullable: true
        resultLog:
          type: string
          nullable: true
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        attempts:
          type: array
          items:
