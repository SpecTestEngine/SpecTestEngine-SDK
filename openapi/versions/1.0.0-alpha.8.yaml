openapi: 3.0.3
info:
  title: SpecTestEngine Public API
  version: 1.0.0-alpha.8
  description: |
    The versioned integration contract for creating, running, observing, and exporting
    SpecTestEngine test assets. The API is project-scoped: the bearer token selects the
    company and active project, and clients must not send internal owner identifiers.

    Every operation requires a short-lived OAuth 2.0 bearer access token. Interactive
    integrations use Authorization Code with PKCE; CI and server-to-server integrations use
    Client Credentials. A SpecTestEngine company administrator registers the integration and
    approves capabilities through the Integration Builder. The builder offers only capabilities
    included in the company's subscription and maps the selection to token scopes. A valid token
    cannot enable a capability outside the current subscription. Generate or browse an SDK without
    credentials, then provide a token only when calling the API. See the SDK authentication guide
    for the complete public procedure.

    This alpha contract covers stable request/response workflows plus the bounded asynchronous
    lifecycle for WebSocket/WSS, SSE, gRPC Streaming, and MQTT tests. Interactive browser recording,
    MCP tools, and AI conversations are documented separately. Browser visual comparison review is
    exposed as a bounded preview workflow; live WebRTC transport and worker coordination remain
    internal implementation details.
  contact:
    name: SpecTestEngine Support
    email: support@ste.software
    url: https://ste.software
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  description: SpecTestEngine product documentation
  url: https://ste.software/docs/sdk
servers:
  - url: https://app.ste.software
    description: Production
  - url: http://localhost
    description: Local Docker gateway
security:
  - BearerAuth: []
tags:
  - name: REST specifications
    description: Persist and execute REST contracts.
  - name: SOAP specifications
    description: Persist and execute SOAP contracts.
  - name: GraphQL specifications
    description: Persist and execute GraphQL contracts.
  - name: Streaming specifications
    description: Persist, validate, execute, observe, and cancel bounded WebSocket/WSS, SSE, gRPC Streaming, and MQTT contracts.
  - name: Fragments
    description: Build reusable request and assertion fragments.
  - name: Flows
    description: Compose and execute ordered API and browser scenarios.
  - name: Run batches
    description: Collect completed specification, UI macro, and flow runs into a release evidence set.
  - name: Snapshots
    description: Promote run-batch evidence into baselines and inspect definition or behavior drift.
  - name: Craftsman
    description: Manage request workspaces, chains, variables, and reusable attachments.
  - name: Sentinel
    description: Configure probes and inspect execution evidence.
  - name: Generation
    description: Generate tests, flows, and portable ATF projects.
  - name: Document visual diffs
    description: Review failed PDF or image attachment assertions without retaining source documents.
  - name: Browser visual reviews
    description: Inspect immutable Browser comparison evidence and apply explicit revision-safe review outcomes.

paths:
  /browser/visual/comparisons/{comparisonId}:
    get:
      tags: [Browser visual reviews]
      summary: Get a Browser visual comparison
      description: Returns one immutable comparison generation, its evidence lineage, normalized exclusions, and currently available review actions.
      operationId: getBrowserVisualComparison
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/BrowserVisualComparisonId'
      responses:
        '200':
          description: Browser visual comparison scoped to the token company and active project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserVisualComparison'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/comparisons/{comparisonId}/use-current-as-new-baseline:
    post:
      tags: [Browser visual reviews]
      summary: Use current as new baseline
      description: Creates and activates a new immutable baseline revision. Historical comparison and baseline evidence remains addressable by Snapshot Timeline.
      operationId: useCurrentBrowserVisualAsNewBaseline
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/BrowserVisualComparisonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserVisualPromoteBaselineRequest'
      responses:
        '200':
          description: Reviewed comparison with the applied baseline revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserVisualComparison'
        '409':
          description: The expected assertion revision is stale or the action id conflicts with another command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/comparisons/{comparisonId}/exclude-and-recompare:
    post:
      tags: [Browser visual reviews]
      summary: Exclude area and recompare
      description: Saves normalized exclusion masks in a new assertion revision and creates a child comparison generation with the existing Browser comparator.
      operationId: excludeBrowserVisualAreaAndRecompare
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/BrowserVisualComparisonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserVisualExcludeAndRecompareRequest'
      responses:
        '200':
          description: New comparison generation linked to the source and root comparisons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserVisualComparison'
        '409':
          description: The expected assertion revision is stale or the action id conflicts with another command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/comparisons/{comparisonId}/keep-as-regression:
    post:
      tags: [Browser visual reviews]
      summary: Keep as regression
      description: Confirms the mismatch as a regression without changing the active baseline or assertion exclusions.
      operationId: keepBrowserVisualAsRegression
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/BrowserVisualComparisonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserVisualKeepRegressionRequest'
      responses:
        '200':
          description: Comparison marked as a confirmed regression.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserVisualComparison'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/artifacts/{artifactId}/content:
    get:
      tags: [Browser visual reviews]
      summary: Download Browser visual evidence
      description: Returns a retained PNG baseline, current, or diff artifact after company and project authorization.
      operationId: getBrowserVisualArtifactContent
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PNG visual evidence subject to the configured artifact retention policy.
          content:
            image/png:
              schema: { type: string, format: binary }
        '410':
          description: The artifact expired; comparison metadata and lineage remain available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/document-diffs/{visualDiffId}:
    get:
      tags: [Document visual diffs]
      summary: Get a visual document diff
      description: Returns the protected viewer URL, TTL, immutable generations, and page-level artifact references.
      operationId: getDocumentVisualDiff
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/VisualDiffId'
      responses:
        '200':
          description: Visual diff metadata scoped to the token company and active project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVisualDiff'
        '410':
          description: Derived visual artifacts expired; source run metadata remains available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/document-diffs/{visualDiffId}/expected:
    post:
      tags: [Document visual diffs]
      summary: Upload a reference document and create a diff generation
      description: The uploaded PDF or image is rendered in memory and discarded. Only encrypted page images and diff metadata remain until TTL expiry.
      operationId: uploadDocumentVisualDiffExpected
      x-sdk-stability: preview
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/VisualDiffId'
        - name: colorThreshold
          in: query
          required: false
          schema: { type: number, format: double, minimum: 0, maximum: 441.6729559300637, default: 24 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [expected]
              properties:
                expected:
                  type: string
                  format: binary
      responses:
        '200':
          description: The visual diff with a new current generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVisualDiff'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/document-diffs/{visualDiffId}/regenerate:
    post:
      tags: [Document visual diffs]
      summary: Regenerate a visual document diff
      description: Creates an immutable generation from the existing rendered pages with new comparison settings and normalized visual exclusion regions.
      operationId: regenerateDocumentVisualDiff
      x-sdk-stability: preview
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/VisualDiffId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVisualDiffRegenerateRequest'
      responses:
        '200':
          description: Visual diff with a new current generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVisualDiff'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/document-diffs/{visualDiffId}/baseline:
    post:
      tags: [Document visual diffs]
      summary: Preview or create an attachment baseline update draft
      description: Never silently overwrites a specification. Send confirm=false first, then confirm=true only after review.
      operationId: prepareDocumentVisualDiffBaseline
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/VisualDiffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVisualDiffBaselineRequest'
      responses:
        '200':
          description: Baseline hash/fingerprint preview or confirmed update draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVisualDiffBaselinePreview'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /browser/visual/document-diffs/{visualDiffId}/artifacts/{artifactId}:
    get:
      tags: [Document visual diffs]
      summary: Download a rendered visual diff page
      operationId: getDocumentVisualDiffArtifact
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/VisualDiffId'
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decrypted PNG page. The encrypted derivative remains subject to the diagnostic TTL.
          content:
            image/png:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/page:
    get:
      tags: [REST specifications]
      summary: List REST specifications
      operationId: listRestSpecifications
      x-sdk-stability: stable
      x-idempotent: true
      parameters:
