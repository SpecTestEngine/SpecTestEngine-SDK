    BrowserActionType:
      type: string
      enum: [NAVIGATE, OPEN_PAGE, SWITCH_PAGE, GO_BACK, GO_FORWARD, REFRESH, CLOSE_PAGE, CLICK, DOUBLE_CLICK, DRAG, SCROLL, FILL, PRESS, SELECT_OPTION, EXTRACT_TEXT]
    BrowserNetworkExpectation:
      type: object
      additionalProperties: false
      description: Local checks over observed browser traffic, never a second HTTP send. Candidates are not executable checks. Recorded credentials are rejected; current-run bindings are private and optional. Body and headers constrain the request; expectedBody and expectedHeaders constrain the response. Explicit empty response-header objects are checks. Unsupported OpenAPI/schema/attachment assertions are rejected, not processed by Browser.
      properties:
        enabled: { type: boolean }
        recordedCallId: { type: integer }
        recordedUrl: { type: string, maxLength: 32768 }
        method: { type: string, maxLength: 16 }
        url: { type: string, maxLength: 32768 }
        expectedStatusCode: { type: integer }
        candidateStatusCode: { type: integer }
        expectedContentType: { type: string, maxLength: 255 }
        candidateContentType: { type: string, maxLength: 255 }
        expectedHeaders: { type: object, additionalProperties: { type: string } }
        candidateHeaders: { type: object, additionalProperties: { type: string } }
        excludedHeaderFields: { type: array, items: { type: string } }
        excludeAllOtherHeaderFields: { type: boolean }
        body: {}
        candidateBody: {}
        expectedBodyPaths:
          type: array
          items: { type: object, additionalProperties: true }
        candidateBodyPaths: { type: object, additionalProperties: true }
        excludedBodyFields: { type: array, items: { type: string } }
        headers:
          type: object
          description: Expected request headers; values may use ${runtime.name} from a prior declared current-run response source.
          additionalProperties: { type: string }
        expectedBody:
          description: Complete expected response JSON value, including explicit null; absence disables this criterion. Partial or unavailable captured bodies cannot pass.
        skipExactBodyCheck: { type: boolean }
        excludeAllOtherBodyFields:
          type: boolean
          description: Include-only response-object comparison. Array include-only is unsupported in Browser.
        occurrence:
          type: integer
          minimum: 1
          maximum: 300
          description: Select this request-start occurrence within its Action and method/URL matcher. Required by guided value-transfer relations; old recorded call IDs are not replay identity.
        requestBodyPaths:
          type: array
          maxItems: 250
          description: Focused outgoing Body checks. A complete runtime placeholder preserves the source JSON type; prefix/suffix text requires a string source.
          items:
            type: object
            additionalProperties: false
            required: [expectedBodyPath, expectedBodyValue]
            properties:
              expectedBodyPath: { type: string, minLength: 1, maxLength: 256 }
              expectedBodyValue: {}
        candidateFields:
          $ref: '#/components/schemas/BrowserNetworkFieldInventory'
        runtimeBindings:
          type: array
          maxItems: 32
          description: Fresh private response sources, active independently of response assertion policy. Never contains a token value. Resume retains the same execution; full Rerun clears it.
          items: { $ref: '#/components/schemas/BrowserNetworkRuntimeBinding' }
    BrowserNetworkFieldInventory:
      type: object
      required: [requestHeaders, requestBody, responseBody, requestHeadersComplete, requestBodyComplete, responseBodyComplete]
      properties:
        requestHeaders: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        requestBody: { type: array, maxItems: 250, items: { $ref: '#/components/schemas/BrowserNetworkField' } }
        responseBody: { type: array, maxItems: 250, items: { $ref: '#/components/schemas/BrowserNetworkField' } }
        requestHeadersComplete: { type: boolean }
        requestBodyComplete: { type: boolean }
        responseBodyComplete: { type: boolean }
    BrowserNetworkField:
      type: object
      required: [path, type]
      properties:
        path: { type: string, maxLength: 256 }
        type: { type: string, enum: [STRING, NUMBER, BOOLEAN, 'NULL', OBJECT, ARRAY] }
    BrowserNetworkRuntimeBinding:
      type: object
      additionalProperties: false
      required: [name, source, path]
      properties:
        name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }
        source: { type: string, enum: [RESPONSE_BODY, RESPONSE_HEADER] }
        path: { type: string, minLength: 1, maxLength: 256 }
        scopeOrigin:
          type: string
          maxLength: 2048
          description: Optional explicit HTTP(S) origin for later matching calls; no credentials, path, query or fragment. Defaults to the source call origin.
    BrowserActionInput:
      type: object
      required: [actionType]
      description: One persisted semantic Browser action. Replay tries only the saved selector candidates in order; missing or ambiguous targets fail explicitly. No selector or visual-change guessing is performed.
      properties:
        orderIndex: { type: integer, minimum: 0 }
        actionType: { $ref: '#/components/schemas/BrowserActionType' }
        selector: { type: string, maxLength: 1000 }
        selectorCandidates:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 1000 }
        value:
          type: string
          maxLength: 4000
          description: Action value or explicit variable template. EXTRACT_TEXT captures a fresh value on every run; a later FILL uses that variable, never a recorded OTP sample.
        sensitive:
          type: boolean
          description: Explicit sensitive-action marker. Persist variable references, not secret literal values.
        timeoutMs: { type: integer, format: int64, minimum: 1, maximum: 120000, default: 20000 }
        tabAlias: { type: string, maxLength: 100 }
        frameSelector: { type: string, maxLength: 1000 }
        variableName: { type: string, maxLength: 100 }
        pattern: { type: string, maxLength: 1000 }
        extractionHint: { type: string, maxLength: 200 }
        textSource: { type: string, enum: [ELEMENT_TEXT, TEXT_BLOCK] }
        expectedPageUrl: { type: string, maxLength: 2000 }
        expectedPageUrlPolicy: { type: string, enum: [IGNORE, CORE, EXACT] }
        expectedPageTitle: { type: string, maxLength: 1000 }
        expectedPageTitlePolicy: { type: string, enum: [IGNORE, EXACT, CONTAINS] }
        expectedNetworkPolicy: { type: string, enum: [IGNORE, PRESENCE, STRICT] }
        expectedNetworkCalls:
          type: array
          maxItems: 250
