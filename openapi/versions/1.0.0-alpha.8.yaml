    CraftsmanRunAccepted:
      type: object
      required: [runId, state]
      properties:
        runId:
          $ref: '#/components/schemas/UuidV7'
        state:
          $ref: '#/components/schemas/CraftsmanRunState'
    CraftsmanStreamingRunInput:
      type: object
      required: [streamingSpec]
      properties:
        name:
          type: string
          maxLength: 255
        streamingSpec:
          $ref: '#/components/schemas/StreamingDefinition'
    CraftsmanRun:
      type: object
      required: [runId, state, createdAt]
      properties:
        runId:
          $ref: '#/components/schemas/UuidV7'
        workspaceId:
          allOf: [{ $ref: '#/components/schemas/UuidV7' }]
          nullable: true
        nodeId:
          allOf: [{ $ref: '#/components/schemas/UuidV7' }]
          nullable: true
        state:
          $ref: '#/components/schemas/CraftsmanRunState'
        result:
          allOf: [{ $ref: '#/components/schemas/RequestChainRun' }]
          nullable: true
        transcript:
          $ref: '#/components/schemas/JsonValue'
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    SpecGenerationResult:
      type: object
      required: [specGenerationType, GeneratedSpec]
      properties:
        specGenerationType:
          type: string
          enum: [POSITIVE, NEGATIVE, DUPLICATE]
        GeneratedSpec:
          type: object
          description: Complete executable REST, SOAP, GraphQL, or Streaming specification DSL.
          additionalProperties: true
    SentinelDashboardSummary:
      type: object
      required: [totalChecks, activeChecks, activeIncidents, runs24h, failedRuns24h, uptime24h]
      properties:
        totalChecks: { type: integer, format: int64, minimum: 0 }
        activeChecks: { type: integer, format: int64, minimum: 0 }
        activeIncidents: { type: integer, format: int64, minimum: 0 }
        runs24h: { type: integer, format: int64, minimum: 0 }
        failedRuns24h: { type: integer, format: int64, minimum: 0 }
        uptime24h: { type: number, format: double, minimum: 0, maximum: 1 }
        averageLatency24h: { type: number, format: double, nullable: true, minimum: 0 }
    SentinelIncident:
      type: object
      required: [id, environment, checkId, checkName, fingerprint, status, consecutiveFailures]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        environment: { type: string }
        checkId: { $ref: '#/components/schemas/UuidV7' }
        checkName: { type: string }
        fingerprint: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        consecutiveFailures: { type: integer, minimum: 0 }
        lastRunId:
          allOf: [{ $ref: '#/components/schemas/UuidV7' }]
          nullable: true
        summary: { type: string, nullable: true, maxLength: 4000 }
        startedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
    SentinelRunBaseline:
      type: object
      required: [id, status, label, definitionHash]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        status: { $ref: '#/components/schemas/RunStatus' }
        label: { type: string }
        definitionHash:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        behaviorHash:
          type: string
          nullable: true
          pattern: '^[a-fA-F0-9]{64}$'
          description: Assertion-relevant fingerprint; raw transport payloads and explicitly excluded evidence do not affect it.
        responseHeadersJson: { type: string, nullable: true }
        responseBodyPreview: { type: string, nullable: true }
        resultLog: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    SentinelCheckInput:
      type: object
      required: [name, environment, type, format, definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 2000
        sourceName:
          type: string
          nullable: true
          maxLength: 255
        environment:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$'
          description: Immutable environment scope for the check and its runs.
        type:
          type: string
          enum: [SPEC, FLOW, URL]
        specType:
          allOf:
            - $ref: '#/components/schemas/SpecType'
          nullable: true
          description: Required when type is SPEC and prohibited when type is FLOW or URL.
        format:
          $ref: '#/components/schemas/ContentFormat'
        definition:
          type: string
          minLength: 2
          maxLength: 10485760
        active:
          type: boolean
          default: true
        timeoutMs:
          type: integer
          format: int64
          minimum: 100
          maximum: 120000
          default: 10000
        failureStrategy:
          type: string
          enum: [FAIL_FAST, CONTINUE_ON_ERROR]
          default: FAIL_FAST
        maxRetries:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        retryDelayMinMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 60000
          default: 5000
        retryDelayMaxMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 60000
          default: 10000
        circuitBreakerFailureThreshold:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        cooldownMs:
          type: integer
          format: int64
          minimum: 1000
          maximum: 86400000
          default: 300000
    SentinelCheck:
      allOf:
        - $ref: '#/components/schemas/SentinelCheckInput'
        - type: object
          required: [id, definitionHash, consecutiveFailures, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/UuidV7'
            definitionHash:
              type: string
            consecutiveFailures:
              type: integer
            pausedUntil:
              type: string
              format: date-time
