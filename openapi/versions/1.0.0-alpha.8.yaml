      type: object
      required: [key, source]
      properties:
        key: { type: string }
        source:
          type: object
          required: [sourceId, revision, name, format]
          properties:
            sourceId: { type: string, format: uuid }
            revision: { type: integer, format: int64, minimum: 0 }
            name: { type: string }
            format: { type: string }
            definition:
              allOf: [{ $ref: '#/components/schemas/FlowRecoveryProjection' }]
              nullable: true
    FlowRecoveryInput:
      type: object
      required: [manifestHash, name, bindings]
      properties:
        manifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 1000, nullable: true }
        bindings:
          type: object
          maxProperties: 1000
          description: Exactly the binding keys requested by preview. Values must be scalar strings, numbers or booleans with their declared type, or variable placeholders; nested objects and null are rejected. Total encoded bindings at most 4 MiB. Values are not retained in the operation journal.
          additionalProperties: true
    FlowRecoveryBinding:
      type: object
      required: [key, path, valueType]
      properties:
        key: { type: string, maxLength: 64 }
        label: { type: string, nullable: true }
        path: { type: string, description: JSON Pointer in the safe authoring definition. }
        valueType: { type: string, enum: [STRING, NUMBER, BOOLEAN] }
        dependencyKey: { type: string, nullable: true, description: Selected dependency identity; null for a Flow-level binding. }
    FlowRecoveryProjection:
      type: object
      required: [bindings]
      properties:
        definitionJson: { type: string, nullable: true, description: Safe authoring JSON only; no runtime values or worker grants. }
        bindings: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FlowRecoveryBinding' } }
        unavailableReason: { type: string, nullable: true }
    FlowRecoveryDependency:
      type: object
