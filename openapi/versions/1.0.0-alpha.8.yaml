    post:
      tags: [Flows]
      summary: Restore an edited historical Flow into the current Flow
      description: Updates the original Flow and selected original dependencies. Shared consumers are affected. Requires current resource update authority. Added saved references stay unchanged. Owner-local receipts make the same exact key/body resumable; some originals may already be updated after a partial failure. No automatic rollback or execution. Mode must be RESTORE. Retain the identical reviewed body and UUID key; GET status never resumes writes.
      operationId: restoreFlowRecoveryDraft
      x-sdk-stability: preview
      x-idempotent: true
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowRecoveryDraftInput' }
      responses:
        '200':
          description: Completed outcome with original Flow ID for RESTORE or new Flow ID for COPY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowRecoveryOperation' }
        '202':
          description: Partial or unconfirmed outcome, not success. Resume only this same request.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowRecoveryOperation' }
        default: { $ref: '#/components/responses/ErrorResponse' }
