        - $ref: '#/components/parameters/Description'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RawSpecification'
      responses:
        '200':
          description: The stored REST specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specification'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/by-id:
    get:
      tags: [REST specifications]
      summary: Get a REST specification
      operationId: getRestSpecification
      x-sdk-stability: stable
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: The requested REST specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specification'
        default:
