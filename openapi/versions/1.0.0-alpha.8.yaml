        - name: includeNegativeTests
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: generateFlowScenarios
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: generationStrategy
          in: query
          required: false
          schema:
            type: string
            enum: [SCHEMA_BASED, LIVE_API_CALL, HYBRID]
            default: SCHEMA_BASED
        - name: negativeTestGenerationMode
          in: query
          required: false
          schema:
            type: string
            enum: [STRICT, EXTENDED]
            default: EXTENDED
      requestBody:
        required: true
        content:
          text/plain:
            schema:
