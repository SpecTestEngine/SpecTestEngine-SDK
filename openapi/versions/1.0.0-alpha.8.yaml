      type: object
      required: [sourceStepId, orderIndex, role]
      properties:
        sourceStepId: { type: string, format: uuid }
        orderIndex: { type: integer, minimum: 0 }
        dependencyKey: { type: string, nullable: true }
        role: { type: string, enum: [EXECUTED, PLANNED_NOT_EXECUTED, USER_ADDED] }
