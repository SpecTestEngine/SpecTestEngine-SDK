  /test/rest-spec/run/by-id/{specId}/visual-diff-captures:
    post:
      tags: [REST specifications]
      summary: Create a visual diff from a failed REST attachment assertion
      description: Explicitly reruns the saved REST specification and temporarily captures one failed PDF or image response. The attachment assertion and run keep their real failed status; no visual-diff fallback changes the test result.
      operationId: captureRestSpecificationAttachmentVisualDiff
      x-sdk-stability: preview
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVisualDiffCaptureRunRequest'
      responses:
        '200':
          description: Complete failed run evidence containing the temporary visual diff link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationRun'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /test/rest-spec/run/page/by-spec-id/{specId}:
    get:
